MOD_JBCOOKIES_LANG_BODY="<p>Бисквитките са малки текстови файлове с информация, които се изпращат и съхраняват на твърдия диск на компютъра на потребителя чрез браузъра при свързване с уебсайт. Бисквитките могат да се използват за събиране и съхраняване на потребителски данни по време на връзката с цел предоставяне на заявените услуги, като понякога те не се запазват след края на сесията. Бисквитките могат да бъдат собствени (на сайта) или на трети страни.</p><p>Съществуват няколко вида бисквитки:</p><ul><li><strong>Технически бисквитки:</strong> улесняват навигацията на потребителя и използването на различните опции или услуги, предлагани от уебсайта, като например идентифициране на сесията, разрешаване на достъп до определени зони, улесняване на поръчки, покупки, попълване на формуляри, регистрации, сигурност и активиране на функционалности (видеоклипове, социални мрежи и др.).</li><li><strong>Бисквитки за персонализация:</strong> позволяват на потребителя да осъществява достъп до услугите според своите предпочитания (език, браузър, конфигурация и др.).</li><li><strong>Аналитични бисквитки:</strong> позволяват анонимен анализ на поведението на потребителите в уебсайта и измерване на тяхната активност с цел разработване на профили за сърфиране и подобряване на сайтовете.</li></ul><p>Ето защо, при достъп до нашия уебсайт, в съответствие с чл. 22 от Закона за услугите на информационното общество (и европейските директиви за личните данни), за аналитичните бисквитки сме поискали вашето съгласие за тяхната употреба. Това се прави с цел подобряване на нашите услуги. Използваме Google Analytics за събиране на анонимна статистическа информация, като например брой посетители на нашия сайт. Бисквитките, добавени от Google Analytics, се уреждат от политиките за поверителност на Google Analytics. Ако желаете, можете да изключите бисквитките на Google Analytics.</p><p>Във всеки случай можете да разрешите или забраните тези бисквитки, като следвате инструкциите на вашия интернет браузър.</p>"
